<main class="shell">
  <header class="hero">
    <p class="eyebrow">Slim todo</p>
    <h1>Today&apos;s focus</h1>
    <p class="lede">Keep a tiny list, keep it close, store it locally.</p>
  </header>

  <form class="todo-form" (ngSubmit)="addTodo()">
    <input
      class="todo-input"
      type="text"
      name="todo"
      autocomplete="off"
      placeholder="Add a quick task"
      [(ngModel)]="draftText"
    />
    <button class="primary" type="submit">Add</button>
  </form>

  @if (todos().length === 0) {
    <p class="empty">Nothing here yet—type above and press Add.</p>
  }

  @if (todos().length > 0) {
    <ul class="todo-list">
      @for (todo of todos(); track todo.id) {
        <li class="todo-item" [class.done]="todo.done">
          <label class="todo-body">
            <input
              type="checkbox"
              [checked]="todo.done"
              (change)="toggleTodo(todo.id)"
            />

            <span class="me-2">{{ todo.text }}</span>

            @if (todo.duration) {
              <span class="badge rounded-pill text-bg-secondary"
                    style="font-size: 0.75rem; vertical-align: middle; margin-left: 8px;">
                {{ todo.duration }}
              </span>
            }
          </label>

          <button class="ghost" type="button" (click)="removeTodo(todo.id)">
            Remove
          </button>
        </li>
      }
    </ul>
  }
</main>
