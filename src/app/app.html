<main class="shell">
  <!-- Simple header to explain the page purpose. -->
  <header class="hero">
    <p class="eyebrow">Slim todo</p>
    <h1>Today&apos;s focus</h1>
    <p class="lede">Keep a tiny list, keep it close, store it locally.</p>
  </header>

  <!-- Form submits to addTodo; ngModel keeps input and class property in sync. -->
  <form class="todo-form" (ngSubmit)="addTodo()">
    <input
      class="todo-input"
      type="text"
      name="todo"
      autocomplete="off"
      placeholder="Add a quick task"
      [(ngModel)]="draftText"
    />
    <button class="primary" type="submit">Add</button>
  </form>

  <!-- Empty state reminder when no todos exist. -->
  @if (todos().length === 0) {
    <p class="empty">Nothing here yet—type above and press Add.</p>
  }

  <!-- List of todos with checkboxes and delete buttons. -->
  @if (todos().length > 0) {
    <ul class="todo-list">
      @for (todo of todos(); track todo.id) {
        <li class="todo-item" [class.done]="todo.done">
          <label class="todo-body">
            <input
              type="checkbox"
              [checked]="todo.done"
              (change)="toggleTodo(todo.id)"
            />
            <span>{{ todo.text }}</span>
            @if (todo.analyzing) {
              <span class="llm-text analyzing">Analyseren...</span>
            } @else if (todo.urgencyBadge) {
              <span class="llm-text" [class.badge-low]="todo.urgencyBadge === 'LOW'" 
                    [class.badge-medium]="todo.urgencyBadge === 'MEDIUM'"
                    [class.badge-high]="todo.urgencyBadge === 'HIGH'">
                {{ todo.urgencyBadge }}
                @if (todo.durationMinutes) {
                  <span class="duration"> · {{ todo.durationMinutes }} min</span>
                }
              </span>
            }
          </label>
          <button class="ghost" type="button" (click)="removeTodo(todo.id)">
            Remove
          </button>
        </li>
      }
    </ul>
  }
</main>
